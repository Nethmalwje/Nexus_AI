# ==============================
# App
# ==============================
spring.application.name=Chatter
server.port=8080

# ==============================
# Database (PostgreSQL)
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/nexus_ai_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# Security (Clerk JWT Resource Server)
# ==============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://eager-viper-53.clerk.accounts.dev

# ==============================
# Spring AI (Ollama Embeddings)
# ==============================
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text

# ==============================
# External API Keys (read from ENV)
# ==============================
CLERK_SECRET_KEY=${CLERK_SECRET_KEY:}

google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:}

gemini.api.key=${GEMINI_API_KEY:}
